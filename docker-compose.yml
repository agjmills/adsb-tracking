services:
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest
    container_name: ultrafeeder
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    networks:
      - proxy-network
      - default
    environment:
      - READSB_DEVICE_TYPE=${READSB_DEVICE_TYPE:-rtlsdr}
      - READSB_RTLSDR_DEVICE=${READSB_RTLSDR_DEVICE:-00001000}
      - TZ=${TZ:-UTC}
      - READSB_LAT=${HOME_LAT}
      - READSB_LON=${HOME_LON}
      - READSB_ALT=${SITE_ALT}
      - READSB_GAIN=${READSB_GAIN:-auto}
      - TAR1090_ENABLED=true
      - WEBPORT=80
    labels:
      - "traefik.enable=false"

  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest
    container_name: piaware
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - BEASTHOST=ultrafeeder
      - TZ=${TZ:-UTC}
      - LAT=${HOME_LAT}
      - LON=${HOME_LON}
      - ALT=${SITE_ALT}
      - FEEDER_ID=${PIAWARE_FEEDER_ID}

  adsbx:
    image: ghcr.io/sdr-enthusiasts/docker-adsbexchange:latest
    container_name: adsbexchange
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - BEASTHOST=ultrafeeder
      - TZ=${TZ:-UTC}
      - LAT=${HOME_LAT}
      - LONG=${HOME_LON}
      - ALT=${SITE_ALT}
      - SITENAME=${ADSX_SITENAME:-Unknown}
      - UUID=${ADSX_UUID}

  leaderboard:
    build: ./leaderboard
    container_name: adsb-leaderboard
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    volumes:
      - adsb-leaderboard-data:/data
    env_file:
      - .env
    environment:
      - HOME_LAT=${HOME_LAT}
      - HOME_LON=${HOME_LON}
      - SITE_NAME=${SITE_NAME:-Unknown}
      - SITE_ALT=${SITE_ALT:-0m}
      - DUMP1090_URL=${DUMP1090_URL:-http://ultrafeeder/data/aircraft.json}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - CLEANUP_HOURS=${CLEANUP_HOURS:-48}
      - PORT=5000
      - FLIGHTAWARE_SITE_ID=${FLIGHTAWARE_SITE_ID:-}
      - TZ=${TZ:-UTC}
    networks:
      - proxy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adsb-lb.rule=Host(`${ADSB_HOST}`)"
      - "traefik.http.routers.adsb-lb.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.adsb-lb.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}"
      - "traefik.http.services.adsb-lb.loadbalancer.server.port=5000"
      - "traefik.docker.network=proxy-network"

networks:
  proxy-network:
    external: true

volumes:
  adsb-leaderboard-data:
